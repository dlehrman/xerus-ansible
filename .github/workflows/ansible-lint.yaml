---
name: ansible-lint
on: # yamllint disable-line rule:truthy
  push: {}
  pull_request:
    branches:
    - main
    - stable
    - release/v*
permissions:
  contents: read
jobs:
  build:
    name: Ansible Lint
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: Run ansible-lint
      uses: ansible/ansible-lint@v26.2.0
